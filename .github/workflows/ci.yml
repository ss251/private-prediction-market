name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  LEO_VERSION: "2.0.0"

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: frontend

      - name: Lint
        run: bun run lint
        working-directory: frontend

      - name: Type check
        run: bun run typecheck
        working-directory: frontend

  test-contracts:
    name: Test Leo Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Leo
        uses: actions/cache@v4
        with:
          path: ~/.leo
          key: leo-${{ env.LEO_VERSION }}

      - name: Install Leo
        run: |
          if ! command -v leo &> /dev/null; then
            curl -L https://raw.githubusercontent.com/ProvableHQ/leo/main/install.sh | sh
          fi
          echo "$HOME/.leo/bin" >> $GITHUB_PATH

      - name: Build contracts
        run: leo build
        working-directory: contracts/prediction_market

      - name: Run Leo tests
        run: leo run --help # Replace with actual test commands
        working-directory: contracts/prediction_market

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: frontend

      - name: Run tests
        run: bun test
        working-directory: frontend

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-format, test-contracts, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: frontend

      - name: Build frontend
        run: bun run build
        working-directory: frontend

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
